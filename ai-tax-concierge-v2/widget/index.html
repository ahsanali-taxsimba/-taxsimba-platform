<!DOCTYPE html>
<html lang="en-GB" data-api-base="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SIMBA AI — Your UK Tax Assistant</title>
  <link rel="stylesheet" href="./css/concierge.css" />
</head>
<body>
  <div class="ts-shell" role="region" aria-label="SIMBA AI — Your UK Tax Assistant">
    <header class="ts-header">
      <div class="ts-brand">
        <div class="ts-logo-chip">
          <img class="ts-logo" src="./assets/taxsimba-logo.svg" width="108" height="18" alt="TaxSimba" />
        </div>
        <div class="ts-brand-text">
          <strong>SIMBA AI</strong>
          <span>Your UK Tax Assistant</span>
        </div>
      </div>
      <div class="ts-meta">
        <span class="ts-pill">Tax year <span id="ts-year">…</span></span>
        <span class="ts-pill" id="ts-mode">…</span>
        <button type="button" class="ts-header-btn" id="ts-topics-btn" hidden>Topics</button>
      </div>
    </header>

    <div id="ts-body" class="ts-body" aria-live="polite"></div>
    <div id="ts-live" class="visually-hidden" style="position:absolute;left:-9999px" aria-live="assertive"></div>

    <form id="ts-form" class="ts-composer" autocomplete="off">
      <label class="visually-hidden" for="ts-input" style="position:absolute;left:-9999px">Ask SIMBA a tax question</label>
      <textarea id="ts-input" rows="1" maxlength="4000" placeholder="Ask about your UK tax situation…" required></textarea>
      <button class="ts-send" id="ts-send" type="submit">Send</button>
    </form>
    <div class="ts-footer">
      SIMBA AI is an AI assistant — not a human accountant, HMRC, or officially approved AI. General information only.
      <button type="button" id="ts-delete">Delete chat</button>
    </div>
  </div>
  <script src="./js/concierge.js" defer></script>
</body>
</html>
